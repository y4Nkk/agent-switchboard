$:
  push:
    - name: 构建 Agent Switchboard Linux 安装包
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      docker:
        image: ubuntu:24.04
        volumes:
          - /root/.cargo/registry:copy-on-write
          - /root/.cargo/git:copy-on-write
          - /root/.npm:copy-on-write
      stages:
        - name: 安装构建依赖
          script: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential ca-certificates curl file pkg-config wget \
              libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev \
              libssl-dev libwebkit2gtk-4.1-dev libxdo-dev
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            wget -q -O /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
            dpkg -i /tmp/packages-microsoft-prod.deb
            apt-get update
            apt-get install -y --no-install-recommends nodejs powershell
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        - name: 安装前端依赖
          script: npm ci
        - name: 测试发布产物扫描器
          script: pwsh -File scripts/assert-release-secret-free.test.ps1
        - name: 验证发布契约与源码
          script: |
            export PATH="/root/.cargo/bin:$PATH"
            export RUSTUP_TOOLCHAIN=stable
            npm run test:updater-release
            cargo test --workspace
            npm test -- --run
            npm run build
        - name: 构建与汇集 Linux 安装包
          script: |
            export PATH="/root/.cargo/bin:$PATH"
            export RUSTUP_TOOLCHAIN=stable
            npm run tauri:build:linux
            version="$(node scripts/updater-release.mjs workspace-version --cargo-manifest Cargo.toml)"
            node scripts/updater-release.mjs stage \
              --build linux-x64 \
              --bundle-directory target/release/bundle \
              --output-directory release-assets \
              --version "$version"
        - name: 扫描发布资产中的凭据
          script: |
            for artifact in release-assets/*; do
              pwsh -File scripts/assert-release-secret-free.ps1 -ArtifactPath "$artifact"
            done
        - name: 上传 Linux 安装包附件
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./release-assets/*"
