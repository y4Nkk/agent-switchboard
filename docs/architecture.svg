<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Agent Switchboard 本地架构与安全写入流程</title>
  <desc id="desc">React 界面经 Tauri 命令边界调用 Rust 契约、客户端适配器和唯一切换执行器。执行器负责将组合后的配置安全写入 Codex 或 Claude Code；应用数据、宿主配置和官方登录缓存拥有清晰边界。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071725"/><stop offset="1" stop-color="#102b48"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#52e1ff"/><stop offset="0.5" stop-color="#2388f2"/><stop offset="1" stop-color="#8377ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020914" flood-opacity=".34"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#68c8ff"/></marker>
    <style>.title{font:700 30px 'Segoe UI','Noto Sans SC',sans-serif;fill:#f8fbff}.subtitle{font:400 15px 'Segoe UI','Noto Sans SC',sans-serif;fill:#aac2d8}.section{font:700 13px 'Segoe UI','Noto Sans SC',sans-serif;letter-spacing:1.6px;fill:#77d9ff}.cardtitle{font:700 18px 'Segoe UI','Noto Sans SC',sans-serif;fill:#f7fbff}.body{font:400 14px 'Segoe UI','Noto Sans SC',sans-serif;fill:#b6c7d8}.small{font:600 12px 'Segoe UI','Noto Sans SC',sans-serif;fill:#8faec7}.number{font:700 14px 'Segoe UI','Noto Sans SC',sans-serif;fill:#071725}.line{stroke:#68c8ff;stroke-width:2;fill:none;marker-end:url(#arrow)}.dashed{stroke:#476a87;stroke-width:1.5;stroke-dasharray:6 7;fill:none}.card{fill:#0e263c;stroke:#31556f;stroke-width:1.25}.panel{fill:#0b2033;stroke:#264861;stroke-width:1.25}.secure{fill:#102f46;stroke:#58d6ff;stroke-width:1.5}.host{fill:#172943;stroke:#6684ae;stroke-width:1.25}.step{fill:#e7f8ff}.label{fill:#0a1b2d;font:700 12px 'Segoe UI','Noto Sans SC',sans-serif}</style>
  </defs>
  <rect width="1440" height="820" rx="32" fill="url(#background)"/>
  <circle cx="1230" cy="84" r="280" fill="#1d75bc" opacity=".11"/><circle cx="122" cy="758" r="250" fill="#6955dc" opacity=".10"/>
  <text x="72" y="72" class="title">Agent Switchboard · 本地配置架构</text><text x="72" y="102" class="subtitle">单一写入执行器 · 明确数据所有权 · 可预览、可恢复的客户端配置事务</text>
  <text x="72" y="158" class="section">交互与命令边界</text>
  <g filter="url(#shadow)"><rect x="72" y="178" width="274" height="142" rx="18" class="card"/><text x="98" y="216" class="cardtitle">React / TypeScript</text><text x="98" y="244" class="body">呈现状态、编辑档案、查看预览</text><text x="98" y="268" class="body">不拼接客户端配置文本</text><text x="98" y="295" class="small">仅请求类型化操作</text></g>
  <path d="M 350 249 H 412" class="line"/>
  <g filter="url(#shadow)"><rect x="418" y="178" width="286" height="142" rx="18" class="secure"/><rect x="418" y="178" width="286" height="6" rx="3" fill="url(#accent)"/><text x="444" y="216" class="cardtitle">Tauri 命令边界</text><text x="444" y="244" class="body">载荷校验、结果脱敏、状态反馈</text><text x="444" y="268" class="body">界面不能直接触达真实文件</text><text x="444" y="295" class="small">唯一的桌面调用入口</text></g>
  <path d="M 708 249 H 770" class="line"/>
  <g filter="url(#shadow)"><rect x="776" y="178" width="286" height="142" rx="18" class="card"/><text x="802" y="216" class="cardtitle">Rust 契约与规划</text><text x="802" y="244" class="body">档案、所有权、校验、差异与锁</text><text x="802" y="268" class="body">规划阶段保持无副作用</text><text x="802" y="295" class="small">asb-core · asb-switch</text></g>
  <text x="72" y="388" class="section">配置合成与受控写入</text>
  <g filter="url(#shadow)"><rect x="72" y="408" width="294" height="184" rx="18" class="panel"/><text x="98" y="446" class="cardtitle">应用拥有的数据</text><text x="98" y="477" class="body">通用设置</text><text x="232" y="477" class="small">客户端独立文件</text><text x="98" y="505" class="body">供应商档案</text><text x="232" y="505" class="small">一档案一文件</text><text x="98" y="533" class="body">历史与备份</text><text x="232" y="533" class="small">事务证据</text><text x="98" y="564" class="small">密钥只在本地受管字段中持有</text></g>
  <path d="M 370 500 H 432" class="line"/>
  <g filter="url(#shadow)"><rect x="438" y="408" width="354" height="184" rx="18" class="secure"/><rect x="438" y="408" width="354" height="6" rx="3" fill="url(#accent)"/><text x="464" y="446" class="cardtitle">唯一切换执行器</text><text x="464" y="476" class="body">合成：固定通用设置 + 当前档案完整声明</text><text x="464" y="504" class="body">保留：宿主未知字段与原始登录缓存</text><text x="464" y="532" class="body">移除：上一档案拥有、当前未声明的字段</text><text x="464" y="564" class="small">这是唯一允许写真实客户端配置的层</text></g>
  <path d="M 796 500 H 858" class="line"/>
  <g filter="url(#shadow)"><rect x="864" y="408" width="246" height="184" rx="18" class="card"/><text x="890" y="446" class="cardtitle">客户端适配器</text><text x="890" y="476" class="body">Codex TOML</text><text x="890" y="504" class="body">Claude Code JSON</text><text x="890" y="536" class="small">解析 · 合并 · 渲染</text><text x="890" y="560" class="small">无直接写入权</text></g>
  <path d="M 1114 500 H 1172" class="line"/>
  <g filter="url(#shadow)"><rect x="1178" y="408" width="190" height="184" rx="18" class="host"/><text x="1204" y="446" class="cardtitle">宿主配置</text><text x="1204" y="476" class="body">Codex</text><text x="1204" y="502" class="small">config.toml</text><text x="1204" y="532" class="body">Claude Code</text><text x="1204" y="558" class="small">settings.json</text></g>
  <path d="M 1010 320 V 370 H 1224 V 404" class="dashed"/><text x="1032" y="358" class="small">预览只读取、渲染与脱敏</text>
  <text x="72" y="658" class="section">一次确认后的事务顺序</text>
  <g><circle cx="98" cy="714" r="18" class="step"/><text x="94" y="719" class="number">1</text><text x="128" y="719" class="body">加锁</text><path d="M 190 714 H 236" class="line"/><circle cx="260" cy="714" r="18" class="step"/><text x="256" y="719" class="number">2</text><text x="290" y="719" class="body">冲突检查</text><path d="M 386 714 H 432" class="line"/><circle cx="456" cy="714" r="18" class="step"/><text x="452" y="719" class="number">3</text><text x="486" y="719" class="body">备份</text><path d="M 548 714 H 594" class="line"/><circle cx="618" cy="714" r="18" class="step"/><text x="614" y="719" class="number">4</text><text x="648" y="719" class="body">临时写入与校验</text><path d="M 804 714 H 850" class="line"/><circle cx="874" cy="714" r="18" class="step"/><text x="870" y="719" class="number">5</text><text x="904" y="719" class="body">原子替换</text><path d="M 1018 714 H 1064" class="line"/><circle cx="1088" cy="714" r="18" class="step"/><text x="1084" y="719" class="number">6</text><text x="1118" y="719" class="body">写后验证 / 失败恢复</text></g>
  <text x="72" y="776" class="subtitle">官方登录缓存不在应用管理范围内；未知字段始终属于宿主客户端。</text>
</svg>
