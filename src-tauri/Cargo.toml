[package]
name = "agent-switchboard"
version.workspace = true
edition.workspace = true
default-run = "agent-switchboard"

[features]
desktop-e2e = []

[lib]
name = "agent_switchboard_lib"
# Desktop-only: link statically into the exe. A cdylib would push the GNU
# linker past its export-ordinal limit on the windows-* dependency set.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
asb-core = { path = "../crates/asb-core" }
asb-switch = { path = "../crates/asb-switch" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Platform defaults, used after honoring Windows process directory overrides.
dirs = "6"
# GitHub tarball extraction for skill sources (gzip + untar, size-capped).
flate2 = "1"
fontdb = "0.23"
log = "0.4"
notify = "6.1"
bytes = "1"
brotli = "8"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io-util"] }
toml_edit = "0.22"
# System credential storage for extension secrets (Windows Credential
# Manager, macOS Keychain, Linux secret service).
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
tar = "0.4"
# Outbound HTTP for probe / models / update / quota / OAuth / cloud backup.
# rustls verifies against the OS root store (native-roots) the way the native
# stack did, and system-proxy keeps automatic proxy discovery. No compression
# or HTTP/2 features: bodies are small JSON and the native stack spoke
# HTTP/1.1.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls-native-roots",
    "socks",
    "system-proxy",
] }
# Read-only access to the import source's SQLite database, plus the guarded
# applier for exported provider SQL. `bundled` compiles libsqlite3-sys with
# the system cc (scoop gcc on this windows-gnu host); `hooks` powers the
# statement authorizer.
rusqlite = { version = "0.32", features = ["bundled", "backup", "hooks", "limits"], default-features = false }
rquickjs = "0.12.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
sha1 = "0.10"
# `common-controls-v6` stays off: it only embeds the manifest into bins, and
# our build.rs embeds one for every target (tests included) via windres.
# `devtools` stays off: release builds must not expose the WebView inspector
# (F12/Ctrl+Shift+I). Debug builds get devtools automatically.
tauri = { version = "2", default-features = false, features = [
    "wry",
    "compression",
    "dynamic-acl",
    "macos-private-api",
] }
# Opens provider service URLs in the system browser. wry silently blocks
# `target=_blank` new-window requests, so external links must go through it.
tauri-plugin-opener = "2"
# Native directory picker for source-folder selection, driven from Rust
# commands so both the desktop webview and the browser-dev backend can use it.
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# The custom Windows installer owns the exact NSIS updater invocation emitted by 2.11.0.
tauri-plugin-updater = "=2.11.0"
# Rejects additional desktop launches: the duplicate process exits during
# plugin init and the surviving instance restores its main window instead.
tauri-plugin-single-instance = "2"
tiny_http = "0.12"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2", default-features = false, features = ["tray-icon"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
zbus = "5.19"

# Windows keeps user/system environment variables in the registry; the Claude
# environment-conflict check reads, backs up, and removes `ANTHROPIC*` there.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", default-features = false }
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
minisign-verify = "0.2.5"
tempfile = "3"
