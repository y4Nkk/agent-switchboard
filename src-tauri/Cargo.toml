[package]
name = "agent-switchboard"
version.workspace = true
edition.workspace = true
default-run = "agent-switchboard"

[lib]
name = "agent_switchboard_lib"
# Desktop-only: link statically into the exe. A cdylib would push the GNU
# linker past its export-ordinal limit on the windows-* dependency set.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
asb-core = { path = "../crates/asb-core" }
asb-switch = { path = "../crates/asb-switch" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Resolves the app-data directory before Tauri creates its first WebView.
# This is the same platform resolver Tauri uses for `app_data_dir`.
dirs = "6"
log = "0.4"
# Read-only access to the CC Switch SQLite database. `bundled` compiles
# libsqlite3-sys with the system cc (scoop gcc on this windows-gnu host).
rusqlite = { version = "0.32", features = ["bundled"], default-features = false }
rquickjs = "0.12.2"
serde = { workspace = true }
serde_json = { workspace = true }
# `common-controls-v6` stays off: it only embeds the manifest into bins, and
# our build.rs embeds one for every target (tests included) via windres.
tauri = { version = "2", default-features = false, features = [
    "wry",
    "compression",
    "dynamic-acl",
    "devtools",
    "tray-icon",
] }
# Opens provider service URLs in the system browser. wry silently blocks
# `target=_blank` new-window requests, so external links must go through it.
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_UI_WindowsAndMessaging",
] }
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3"
