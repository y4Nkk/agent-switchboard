<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #d6eef3; }
    #pelican-ride { position: relative; width: 100%; height: 100%; }
    .scene { display: block; width: 100%; height: 100%; }
    .playback {
      position: absolute; right: 14px; bottom: 14px; display: grid; place-items: center;
      width: 38px; height: 38px; padding: 9px; border: 1px solid #294b5340;
      border-radius: 50%; color: #294b53; background: #ffffffeb; cursor: pointer;
    }
    .playback:hover { background: #fff; }
    .playback:focus-visible { outline: 3px solid #294b53; outline-offset: 3px; }
    .playback svg { width: 100%; height: 100%; fill: currentColor; }
    .playback .play, .playback[data-paused="true"] .pause { display: none; }
    .playback[data-paused="true"] .play { display: block; }
    .playback[hidden] { display: none; }
    @media (max-width: 420px) {
      .playback { right: 8px; bottom: 8px; }
    }
  </style>
</head>

<script type="module">
  const scene = document.getElementById('pelican-ride');
  const svg = scene.querySelector('.scene');
  const button = scene.querySelector('.playback');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const ids = ['spokes', 'planks', 'shadow', 'chain', 'chainring', 'body', 'head', 'tail', 'eye',
    'wing-far', 'wing-near', 'wing-detail', 'waves-far', 'waves-near', 'boat',
    'crank-far', 'crank-near', 'pedal-far', 'pedal-near', 'leg-far', 'leg-near',
    'leg-highlight', 'foot-far', 'foot-near', 'toes', 'cloud-a', 'cloud-b', 'cloud-c', 'bird-a', 'bird-b'];
  const parts = Object.fromEntries(ids.map((id) => [id, svg.querySelector('#pr-' + id)]));
  const set = (id, name, value) => parts[id].setAttribute(name, value);
  const shift = (id, x, y) => set(id, 'transform', 'translate(' + x + ' ' + y + ')');

  const wheelRadius = 107, rearGearRadius = 15, frontGearRadius = 27;
  const speed = 480, crankRadius = 31, thighLength = 112, shinLength = 115;
  const crank = { x: 582, y: 487 }, hip = { x: 529, y: 322 };
  const initialAngle = -.7;

  function drawLeg(side, angle, bob) {
    const pedal = { x: crank.x + crankRadius * Math.cos(angle), y: crank.y + crankRadius * Math.sin(angle) };
    const ankle = { x: pedal.x - 4, y: pedal.y - 10 };
    const origin = { x: hip.x, y: hip.y + bob };
    const dx = ankle.x - origin.x, dy = ankle.y - origin.y;
    const distance = Math.hypot(dx, dy);
    const along = (thighLength ** 2 - shinLength ** 2 + distance ** 2) / (2 * distance);
    const bend = Math.sqrt(Math.max(0, thighLength ** 2 - along ** 2));
    // The forward knee solution keeps fixed bone lengths and the ankle on its pedal.
    const knee = { x: origin.x + (dx * along + dy * bend) / distance,
      y: origin.y + (dy * along - dx * bend) / distance };
    const path = 'M' + origin.x + ' ' + origin.y + ' L' + knee.x + ' ' + knee.y + ' L' + ankle.x + ' ' + ankle.y;
    set('leg-' + side, 'd', path);
    if (side === 'near') set('leg-highlight', 'd', path);
    set('crank-' + side, 'd', 'M582 487 L' + pedal.x + ' ' + pedal.y);
    shift('pedal-' + side, pedal.x, pedal.y);
    shift('foot-' + side, pedal.x, pedal.y);
    if (side === 'near') shift('toes', pedal.x, pedal.y);
  }

  function drawRider(angle, seconds) {
    const bob = Math.sin((angle - initialAngle) * 2) * 1.6;
    shift('body', 0, bob);
    set('head', 'transform', 'rotate(' + (Math.sin(seconds * 1.8) * 1.1) + ' 555 242)');
    set('tail', 'transform', 'rotate(' + (Math.sin(seconds * 3) * 2.2) + ' 397 277)');
    const blink = seconds % 5.4;
    const openness = blink > 4.95 && blink < 5.15 ? .15 + .85 * Math.abs(blink - 5.05) / .1 : 1;
    set('eye', 'transform', 'translate(0 ' + (159 * (1 - openness)) + ') scale(1 ' + openness + ')');
    set('wing-far', 'd', 'M542 ' + (255 + bob) + ' Q612 ' + (248 + bob) +
      ' 674 266 L772 277 L776 286 Q680 287 608 ' + (278 + bob) + ' L546 ' + (278 + bob) + 'Z');
    set('wing-near', 'd', 'M504 ' + (258 + bob) + ' C545 ' + (246 + bob) + ' 590 ' +
      (253 + bob) + ' 626 265 Q695 278 771 281 Q782 283 776 293 Q767 303 740 300 L654 294 Q584 ' +
      (303 + bob) + ' 539 ' + (284 + bob) + ' Q517 ' + (280 + bob) + ' 504 ' + (258 + bob) + 'Z');
    set('wing-detail', 'd', 'M532 ' + (263 + bob) + ' Q575 ' + (273 + bob) + ' 616 279 T724 289');
    drawLeg('far', angle + Math.PI, bob);
    drawLeg('near', angle, bob);
    set('shadow', 'rx', 352 - bob * 2);
  }

  function render(seconds) {
    const distance = seconds * speed;
    const wheelAngle = distance / wheelRadius;
    const angle = initialAngle + wheelAngle * rearGearRadius / frontGearRadius;
    set('spokes', 'transform', 'rotate(' + ((wheelAngle * 180 / Math.PI) % 360) + ')');
    set('chainring', 'transform', 'rotate(' + (angle * 180 / Math.PI % 360) + ' 582 487)');
    set('chain', 'stroke-dashoffset', -((angle - initialAngle) * frontGearRadius % 8));
    set('planks', 'patternTransform', 'translate(' + -(distance % 96) + ' 0)');
    shift('waves-far', -(seconds * 12 % 160), 0);
    shift('waves-near', -(seconds * 25 % 160), 0);
    shift('boat', ((169 + 160 - seconds * 9) % 1520 + 1520) % 1520 - 160, 385 + Math.sin(seconds * 1.3) * 1.2);
    for (const [id, x, y, scale, drift] of [
      ['cloud-a', 181, 114, 1, 6], ['cloud-b', 615, 72, .66, 4], ['cloud-c', 1090, 213, .83, 8],
    ]) {
      const position = ((x + 160 - seconds * drift) % 1520 + 1520) % 1520 - 160;
      set(id, 'transform', 'translate(' + position + ' ' + y + ') scale(' + scale + ')');
    }
    for (const [id, x, y, scale, offset] of [
      ['bird-a', 292, 166, 1, 0], ['bird-b', 335, 144, .7, .8],
    ]) {
      const position = ((x + 60 - seconds * 18) % 1320 + 1320) % 1320 - 60;
      const lift = Math.sin(seconds * 2.8 + offset) * 5;
      set(id, 'transform', 'translate(' + position + ' ' + (y + Math.sin(seconds + offset) * 3) + ') scale(' + scale + ')');
      set(id, 'd', 'M-14 2 Q-7 ' + (-7 + lift) + ' 0 0 Q7 ' + (-7 + lift) + ' 14 2');
    }
    drawRider(angle, seconds);
  }

  let playing = !motion.matches, inView = true, frame = 0, previous = null, elapsed = 0;
  function tick(now) {
    if (previous !== null) elapsed += Math.min((now - previous) / 1000, .05);
    previous = now;
    render(elapsed);
    frame = requestAnimationFrame(tick);
  }
  function syncPlayback() {
    cancelAnimationFrame(frame);
    previous = null;
    if (playing && inView && !document.hidden) frame = requestAnimationFrame(tick);
    const label = playing ? '暂停动画' : '播放动画';
    button.dataset.paused = String(!playing);
    button.setAttribute('aria-label', label);
    button.title = label;
  }
  button.addEventListener('click', () => { playing = !playing; syncPlayback(); });
  motion.addEventListener('change', (event) => {
    if (event.matches) { playing = false; syncPlayback(); }
  });
  document.addEventListener('visibilitychange', syncPlayback);
  new IntersectionObserver(([entry]) => { inView = entry.isIntersecting; syncPlayback(); }).observe(scene);
  render(0);
  button.hidden = false;
