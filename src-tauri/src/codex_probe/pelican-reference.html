  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #a8cdd1; }
    #pelican-ride { position: relative; width: 100%; height: 100%; }
    .scene { display: block; width: 100%; height: 100%; }
    .playback {
      position: absolute; right: 14px; bottom: 14px; display: grid; place-items: center;
      width: 38px; height: 38px; padding: 9px; border: 1px solid #243e4966;
      border-radius: 50%; color: #243e49; background: #fffaf0f2; cursor: pointer;
    }
    .playback:hover { background: #fff; }
    .playback:focus-visible { outline: 3px solid #243e49; outline-offset: 3px; }
    .playback svg { width: 100%; height: 100%; fill: currentColor; }
    .playback .play, .playback[data-paused="true"] .pause, .playback[hidden] { display: none; }
    .playback[data-paused="true"] .play { display: block; }
    @media (max-width: 420px) {
      .playback { right: 8px; bottom: 8px; }
    }
  </style>
</head>

<script type="module">
  const scene = document.getElementById('pelican-ride');
  const button = scene.querySelector('.playback');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const parts = new Map([...scene.querySelectorAll('[id^="pr-"]')].map((part) => [part.id.slice(3), part]));
  const set = (part, name, value) => parts.get(part).setAttribute(name, value);
  const translate = (part, x, y) => set(part, 'transform', 'translate(' + x + ' ' + y + ')');
  const degrees = 180 / Math.PI;
  const wrap = (value, period) => ((value % period) + period) % period;
  const wheelRadius = 112, rearGearRadius = 20, frontGearRadius = 30, speed = 534;
  const crankRadius = 37, thighLength = 113, shinLength = 123, initialAngle = -.86;
  const crank = { x: 572, y: 482 }, hip = { x: 518, y: 306 };

  function drawLeg(side, angle, bob) {
    const x = crank.x + crankRadius * Math.cos(angle);
    const y = crank.y + crankRadius * Math.sin(angle);
    const pitch = .15 * Math.sin(angle + .3);
    const ankleX = x - 9 * Math.cos(pitch) + 11 * Math.sin(pitch);
    const ankleY = y - 9 * Math.sin(pitch) - 11 * Math.cos(pitch);
    const originY = hip.y + bob;
    const dx = ankleX - hip.x, dy = ankleY - originY;
    const distance = Math.hypot(dx, dy);
    const along = (thighLength ** 2 - shinLength ** 2 + distance ** 2) / (2 * distance);
    const bend = Math.sqrt(Math.max(0, thighLength ** 2 - along ** 2));
    const kneeX = hip.x + (dx * along + dy * bend) / distance;
    const kneeY = originY + (dy * along - dx * bend) / distance;
    const leg = 'M' + hip.x + ' ' + originY + ' L' + kneeX + ' ' + kneeY + ' L' + ankleX + ' ' + ankleY;
    set('leg-' + side, 'd', leg);
    if (side === 'near') set('leg-light', 'd', leg);
    set('crank-' + side, 'd', 'M' + crank.x + ' ' + crank.y + ' L' + x + ' ' + y);
    translate('pedal-' + side, x, y);
    set('foot-' + side, 'transform', 'translate(' + x + ' ' + y + ') rotate(' + pitch * degrees + ')');
  }

  function drawRider(angle, seconds) {
    const bob = Math.sin((angle - initialAngle) * 2) * 1.5;
    translate('rider', 0, bob);
    set('head', 'transform', 'rotate(' + Math.sin(seconds * 2.1) * 1.35 + ' 606 234)');
    set('tail', 'transform', 'rotate(' + Math.sin(seconds * 3) * 2.8 + ' 415 273)');
    const blink = Math.abs(seconds % 5.2 - 4.85);
    const openness = Math.min(1, .12 + blink * 8.8);
    set('eye', 'transform', 'translate(0 ' + 141 * (1 - openness) + ') scale(1 ' + openness + ')');
    drawLeg('far', angle + Math.PI, bob);
    drawLeg('near', angle, bob);
    set('shadow', 'rx', 345 - bob * 1.4);
  }

  function drawCoast(seconds, distance) {
    set('planks', 'patternTransform', 'translate(' + -(distance % 176) + ' 0)');
    set('far-ripples', 'patternTransform', 'translate(' + -(seconds * 8 % 246) + ' 0)');
    set('near-ripples', 'patternTransform', 'translate(' + -(seconds * 23 % 304) + ' 0)');
    translate('boat', wrap(1177 - seconds * 8, 1500) - 150, 395 + Math.sin(seconds * 1.5) * 1.8);
    for (const [id, x, y, scale, drift] of [
      ['cloud-a', 195, 120, 1, 7], ['cloud-b', 476, 83, .71, 4], ['cloud-c', 1045, 203, .83, 6],
    ]) {
      const position = wrap(x + 150 - seconds * drift, 1500) - 150;
      set(id, 'transform', 'translate(' + position + ' ' + y + ') scale(' + scale + ')');
    }
    for (const [id, x, y, scale, phase] of [
      ['bird-a', 365, 164, 1, 0], ['bird-b', 415, 148, .72, .9],
    ]) {
      const position = wrap(x + 28 - seconds * 16, 1256) - 28;
      const lift = Math.sin(seconds * 3.4 + phase) * 5;
      set(id, 'transform', 'translate(' + position + ' ' + (y + Math.sin(seconds + phase) * 3) + ') scale(' + scale + ')');
      set(id, 'd', 'M-14 3 Q-7 ' + (-7 + lift) + ' 0 0 Q7 ' + (-7 + lift) + ' 14 3');
    }
  }

  function render(seconds) {
    const distance = seconds * speed;
    const wheelAngle = distance / wheelRadius;
    const driveAngle = wheelAngle * rearGearRadius / frontGearRadius;
    const angle = initialAngle + driveAngle;
    set('spokes', 'transform', 'rotate(' + (wheelAngle * degrees % 360) + ')');
    set('chainring', 'transform', 'rotate(' + (angle * degrees % 360) + ' ' + crank.x + ' ' + crank.y + ')');
    set('chain', 'stroke-dashoffset', -(driveAngle * frontGearRadius % 8));
    drawCoast(seconds, distance);
    drawRider(angle, seconds);
  }

  let playing = !motion.matches, inView = false, frame = 0, previous = null, elapsed = 0;
  function tick(now) {
    if (previous !== null) elapsed += Math.min((now - previous) / 1000, .05);
    previous = now;
    render(elapsed);
    frame = requestAnimationFrame(tick);
  }

  function syncPlayback() {
    cancelAnimationFrame(frame);
    previous = null;
    if (playing && inView && !document.hidden) frame = requestAnimationFrame(tick);
    const label = playing ? '暂停动画' : '播放动画';
    button.dataset.paused = String(!playing);
    button.setAttribute('aria-label', label);
    button.title = label;
  }

  button.addEventListener('click', () => { playing = !playing; syncPlayback(); });
  motion.addEventListener('change', (event) => {
    if (event.matches) { playing = false; syncPlayback(); }
  });
  document.addEventListener('visibilitychange', syncPlayback);
  new IntersectionObserver(([entry]) => { inView = entry.isIntersecting; syncPlayback(); }).observe(scene);
  render(0);
  button.hidden = false;
  syncPlayback();
</script>
</body>
</html>
