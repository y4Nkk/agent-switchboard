name: 构建 Windows 安装包

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 构建 NSIS 安装包
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 配置 Rust GNU 工具链
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - name: 安装 MinGW 链接工具
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc

      - name: 将 MinGW 加入构建路径
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"

      - name: 安装前端依赖
        run: npm ci

      - name: 运行 Rust 测试
        run: cargo test --workspace

      - name: 运行前端测试
        run: npm test -- --run

      - name: 构建 Tauri 安装包
        run: npm run tauri build

      - name: 上传 NSIS 安装包
        uses: actions/upload-artifact@v7
        with:
          name: agent-switchboard-windows-x64
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      # 推送 v* 标签时，把 NSIS 安装包发布为正式 GitHub Release（非草稿、
      # 非预发布），应用内「检查更新」读取的 releases/latest 由它提供。
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem "target/release/bundle/nsis/*-setup.exe" |
            Sort-Object LastWriteTime | Select-Object -Last 1
          gh release create $env:GITHUB_REF_NAME $setup.FullName `
            --title $env:GITHUB_REF_NAME --generate-notes
