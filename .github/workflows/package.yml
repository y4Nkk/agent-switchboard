name: 打包发布

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            name: Windows x64（自绘安装器）
            runs-on: windows-latest
            rust-toolchain: stable-x86_64-pc-windows-gnu
            build-script: tauri:build:windows
            artifact-name: agent-switchboard-release-windows-x64
          - id: macos-arm64
            name: macOS Apple Silicon（dmg + updater）
            runs-on: macos-14
            rust-toolchain: stable
            build-script: tauri:build:macos
            artifact-name: agent-switchboard-release-macos-arm64
          - id: macos-x64
            name: macOS Intel（dmg + updater）
            runs-on: macos-15-intel
            rust-toolchain: stable
            build-script: tauri:build:macos
            artifact-name: agent-switchboard-release-macos-x64
          - id: linux-x64
            name: Linux x64（deb + AppImage）
            runs-on: ubuntu-22.04
            rust-toolchain: stable
            build-script: tauri:build:linux
            artifact-name: agent-switchboard-release-linux-x64
    env:
      # Overrides the repo's windows-gnu rust-toolchain.toml pin on
      # non-Windows runners; the Windows job re-states its own pin.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust-toolchain }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 配置 Rust GNU 工具链
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - name: 安装 MinGW 链接工具
        if: matrix.id == 'windows-x64'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc

      - name: 将 MinGW 加入构建路径
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"

      - name: 安装 Linux 系统依赖
        if: matrix.id == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev

      - name: 安装 macOS 7-Zip
        if: runner.os == 'macOS'
        run: brew install p7zip

      - name: 测试发布产物扫描器
        shell: pwsh
        run: .\scripts\assert-release-secret-free.test.ps1

      - name: 安装前端依赖
        run: npm ci

      - name: 测试 Updater 发布清单
        if: matrix.id == 'linux-x64'
        run: npm run test:updater-release

      - name: 测试自绘安装器契约
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: .\scripts\test-windows-installer.ps1

      - name: 运行 Rust 测试
        run: cargo test --workspace

      - name: 运行前端测试
        run: npm test -- --run

      - name: 校验发布标签版本
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          node scripts/updater-release.mjs validate-version `
            --cargo-manifest Cargo.toml --tag $env:GITHUB_REF_NAME --version $version

      - name: 构建安装包
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run ${{ matrix.build-script }}

      - name: 构建签名更新包
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run ${{ matrix.build-script }} -- --config src-tauri/tauri.updater.conf.json

      - name: 汇集发布资产
        shell: pwsh
        run: |
          $version = (node scripts/updater-release.mjs workspace-version --cargo-manifest Cargo.toml).Trim()
          $arguments = @(
            "scripts/updater-release.mjs", "stage",
            "--build", "${{ matrix.id }}",
            "--bundle-directory", "target/release/bundle",
            "--output-directory", "release-assets",
            "--version", $version
          )
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $arguments += "--include-updater"
          }
          & node @arguments

      - name: 验证已签名更新包
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $signatures = @(Get-ChildItem -LiteralPath release-assets -File -Filter '*.sig')
          if ($signatures.Count -eq 0) {
            throw "没有待验证的更新包签名。"
          }
          foreach ($signature in $signatures) {
            $artifactPath = $signature.FullName.Substring(0, $signature.FullName.Length - $signature.Extension.Length)
            if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
              throw "更新包签名缺少对应载荷：$($signature.Name)"
            }
            & cargo run --locked --manifest-path src-tauri/Cargo.toml --example verify_updater_artifact -- $artifactPath $signature.FullName
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: 扫描发布资产中的凭据
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath release-assets -File | ForEach-Object {
            .\scripts\assert-release-secret-free.ps1 -ArtifactPath $_.FullName
          }

      - name: 构建 Microsoft Store MSIX
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: npm run msix:package

      - name: 扫描 Microsoft Store 包中的凭据
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath target/release/bundle/msix -Filter '*.msix' -File | ForEach-Object {
            .\scripts\assert-release-secret-free.ps1 -ArtifactPath $_.FullName
          }

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      # The Store replaces this package's signature after certification. Keep
      # the unsigned build in Actions only; a sideloaded copy is not a public
      # release artifact.
      - name: 上传 Microsoft Store 包
        if: matrix.id == 'windows-x64'
        uses: actions/upload-artifact@v7
        with:
          name: agent-switchboard-store-windows-x64
          path: target/release/bundle/msix/*.msix
          if-no-files-found: error
          retention-days: 30

  # Updater manifests describe all supported platforms. A release therefore
  # exists only when the complete matrix succeeds and every required signed
  # payload has passed its platform-specific credential scan.
  release:
    name: 发布 GitHub Release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 校验发布标签版本
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/updater-release.mjs validate-version \
            --cargo-manifest Cargo.toml --tag "$GITHUB_REF_NAME" --version "$version"

      - name: 汇集已扫描的发布资产
        uses: actions/download-artifact@v7
        with:
          pattern: agent-switchboard-release-*
          path: dist
          merge-multiple: true

      - name: 提取本版本更新说明
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/updater-release.mjs release-notes \
            --changelog-file CHANGELOG.md \
            --version "$version" > release-notes.md

      - name: 生成签名更新清单
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/updater-release.mjs manifest \
            --cargo-manifest Cargo.toml \
            --input-directory dist \
            --notes-file release-notes.md \
            --output-file dist/latest.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "$version"

      - name: 创建或复用 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release delete-asset "$GITHUB_REF_NAME" latest.json --yes || true
            echo "RELEASE_PREEXISTING=true" >> "$GITHUB_ENV"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
            echo "RELEASE_PREEXISTING=false" >> "$GITHUB_ENV"
          fi

      - name: 先上传安装包与更新载荷
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=()
          for asset in dist/*; do
            [[ "$asset" == "dist/latest.json" ]] && continue
            assets+=("$asset")
          done
          if ((${#assets[@]} == 0)); then
            echo "::error::没有已扫描的发布资产。"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

      - name: 最后发布更新清单
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/latest.json --clobber

      - name: 公开已完成的 Release
        if: env.RELEASE_PREEXISTING == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
