name: 打包发布

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            name: Windows x64（NSIS）
            runs-on: windows-latest
            rust-toolchain: stable-x86_64-pc-windows-gnu
            build-script: tauri:build:windows
            artifact-name: agent-switchboard-windows-x64
            artifact-paths: |
              target/release/bundle/nsis/*-setup.exe
          - id: macos-arm64
            name: macOS Apple Silicon（dmg）
            runs-on: macos-latest
            rust-toolchain: stable
            build-script: tauri:build:macos
            artifact-name: agent-switchboard-macos-arm64
            artifact-paths: |
              target/release/bundle/dmg/*.dmg
          - id: macos-x64
            name: macOS Intel（dmg）
            runs-on: macos-15-intel
            rust-toolchain: stable
            build-script: tauri:build:macos
            artifact-name: agent-switchboard-macos-x64
            artifact-paths: |
              target/release/bundle/dmg/*.dmg
          - id: linux-x64
            name: Linux x64（deb + AppImage）
            runs-on: ubuntu-22.04
            rust-toolchain: stable
            build-script: tauri:build:linux
            artifact-name: agent-switchboard-linux-x64
            artifact-paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    env:
      # Overrides the repo's windows-gnu rust-toolchain.toml pin on
      # non-Windows runners; the Windows job re-states its own pin.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust-toolchain }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 配置 Rust GNU 工具链
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - name: 安装 MinGW 链接工具
        if: matrix.id == 'windows-x64'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc

      - name: 将 MinGW 加入构建路径
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"

      - name: 安装 Linux 系统依赖
        if: matrix.id == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装 macOS 7-Zip
        if: runner.os == 'macOS'
        run: brew install p7zip

      - name: 安装前端依赖
        run: npm ci

      - name: 运行 Rust 测试
        run: cargo test --workspace

      - name: 运行前端测试
        run: npm test -- --run

      - name: 构建 Tauri 安装包
        run: npm run ${{ matrix.build-script }}

      - name: 扫描发布产物中的凭据
        shell: pwsh
        env:
          ARTIFACT_PATTERNS: ${{ matrix.artifact-paths }}
        run: |
          $patterns = $env:ARTIFACT_PATTERNS -split "`r?`n" |
            ForEach-Object { $_.Trim() } | Where-Object { $_ }
          foreach ($pattern in $patterns) {
            Get-ChildItem -Path $pattern -File | ForEach-Object {
              .\scripts\assert-release-secret-free.ps1 -ArtifactPath $_.FullName
            }
          }

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
          retention-days: 30

  # 推送 v* 标签时，将每个成功完成且通过凭据扫描的平台安装包发布为正式
  # GitHub Release（非草稿、非预发布）。应用内「检查更新」读取的
  # releases/latest 由它提供。
  release:
    name: 发布 GitHub Release
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 汇集已完成的安装包
        uses: actions/download-artifact@v7
        with:
          pattern: agent-switchboard-*
          path: dist
          merge-multiple: true

      - name: 发布可用安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if ((${#assets[@]} == 0)); then
            echo "::error::没有完成且通过凭据扫描的安装包，未创建空 Release。"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
              --notes "本 Release 仅包含已完成构建并通过凭据扫描的平台安装包；未显示的平台没有可发布产物。"
          fi
